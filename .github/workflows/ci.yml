name: Data Auditor CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install pyyaml
      - name: Test
        run: python3 -m pytest tests/ -v
      - name: Integration test
        run: |
          python3 auditor.py tests/fixtures/clean.csv --json
          python3 auditor.py tests/fixtures/dirty.csv --json
